service: day13-l3b-monitoring-llmops-lab
primary_slo:
  name: fast_successful_requests
  window: 28d
  sli:
    good_event: 'event == "response_sent" and latency_ms <= 3000'
    total_event: 'event == "request_received"'
  target_percent: 99.5
  error_budget_percent: 0.5
  note: Baseline CP1 có latency P95 khoảng 2165 ms và TTFT P95 50 ms, vì vậy ngưỡng 3000 ms có khoảng đệm nhưng vẫn phát hiện tail latency tăng rõ rệt. Mục tiêu 99.5% cho error budget 0.5%; với 10,000 request trong 28 ngày, tối đa 50 request được phép lỗi hoặc chậm hơn 3000 ms.
guardrails:
  error_rate_pct_max: 2
  daily_cost_usd_max: 2.5
  quality_score_avg_min: 0.75
  retrieval_success_rate_pct_min: 90
